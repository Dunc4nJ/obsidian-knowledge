<svg width="100%" viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" style="background:#0c0c0c">
  <style>
    text { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace; }
    .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }

    @keyframes fadeIn {
      0%, 90% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .s1 { animation: fadeIn 0.5s 0.3s both; }
    .s2 { animation: fadeIn 0.5s 1.0s both; }
    .s3 { animation: fadeIn 0.5s 1.8s both; }
    .s4 { animation: fadeIn 0.5s 2.4s both; }
    .s5 { animation: fadeIn 0.5s 3.0s both; }
    .s6 { animation: fadeIn 0.5s 3.6s both; }
    .s7 { animation: fadeIn 0.5s 4.2s both; }
    .s8 { animation: fadeIn 0.5s 4.8s both; }
    .s9 { animation: fadeIn 0.5s 5.6s both; }
    .s10 { animation: fadeIn 0.5s 6.4s both; }
    .s11 { animation: fadeIn 0.5s 7.2s both; }
    .s12 { animation: fadeIn 0.5s 8.0s both; }

    .cursor {
      animation: blink 1s step-end infinite;
    }
  </style>

  <!-- Terminal chrome -->
  <rect x="20" y="14" width="680" height="412" rx="8" fill="#121212" stroke="#3d3d3d" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="20" y="14" width="680" height="32" rx="8" fill="#181818"/>
  <rect x="20" y="38" width="680" height="8" fill="#181818"/>
  <circle cx="42" cy="30" r="5" fill="#555555"/>
  <circle cx="60" cy="30" r="5" fill="#555555"/>
  <circle cx="78" cy="30" r="5" fill="#555555"/>
  <text x="360" y="34" text-anchor="middle" font-size="11" fill="#717171" class="sans">pgr — ranked, agent-oriented search</text>

  <!-- Step 1: Agent sends search_code query -->
  <g class="s1">
    <text x="40" y="72" font-size="10" fill="#717171">&#9654; search_code</text>
    <text x="145" y="72" font-size="10" fill="#aeaeae">query="apiClient" path="src/"</text>
  </g>

  <!-- Step 2: pgr returns ranked results -->
  <g class="s2">
    <text x="40" y="98" font-size="10" fill="#60a5fa">pgr ranked results:</text>
  </g>

  <!-- Result 1: Definition (ranked first) -->
  <g class="s3">
    <rect x="40" y="108" width="640" height="38" rx="4" fill="#181818"/>
    <text x="52" y="124" font-size="10" fill="#fb923c">1.</text>
    <text x="68" y="124" font-size="10" fill="#ebebeb">src/lib/api/client.ts</text>
    <text x="260" y="124" font-size="9" fill="#222222" class="sans">&#9474;</text>
    <text x="272" y="124" font-size="9" fill="#60a5fa">definition</text>
    <text x="52" y="140" font-size="9" fill="#555555">export class ApiClient {</text>
  </g>

  <!-- Result 2: Usage -->
  <g class="s4">
    <rect x="40" y="150" width="640" height="38" rx="4" fill="#181818"/>
    <text x="52" y="166" font-size="10" fill="#fb923c">2.</text>
    <text x="68" y="166" font-size="10" fill="#ebebeb">src/lib/api/request.ts</text>
    <text x="260" y="166" font-size="9" fill="#222222" class="sans">&#9474;</text>
    <text x="272" y="166" font-size="9" fill="#a78bfa">usage</text>
    <text x="52" y="182" font-size="9" fill="#555555">const client = new ApiClient(config)</text>
  </g>

  <!-- Result 3: Usage -->
  <g class="s5">
    <rect x="40" y="192" width="640" height="38" rx="4" fill="#181818"/>
    <text x="52" y="208" font-size="10" fill="#fb923c">3.</text>
    <text x="68" y="208" font-size="10" fill="#ebebeb">src/commands/sync.ts</text>
    <text x="260" y="208" font-size="9" fill="#222222" class="sans">&#9474;</text>
    <text x="272" y="208" font-size="9" fill="#a78bfa">usage</text>
    <text x="52" y="224" font-size="9" fill="#555555">await apiClient.post("/sync", payload)</text>
  </g>

  <!-- Result 4: Test (ranked lower) -->
  <g class="s6">
    <rect x="40" y="234" width="640" height="38" rx="4" fill="#181818"/>
    <text x="52" y="250" font-size="10" fill="#fb923c">4.</text>
    <text x="68" y="250" font-size="10" fill="#717171">src/lib/api/client.test.ts</text>
    <text x="260" y="250" font-size="9" fill="#222222" class="sans">&#9474;</text>
    <text x="272" y="250" font-size="9" fill="#555555">test</text>
    <text x="52" y="266" font-size="9" fill="#555555">describe("ApiClient", () =&gt; {</text>
  </g>

  <!-- Annotation: definitions first, tests last -->
  <g class="s7">
    <text x="52" y="290" font-size="9" fill="#555555">&#8627; 4 results, grouped by relevance (6ms)</text>
  </g>

  <!-- Step 3: Agent immediately reads the top result -->
  <g class="s8">
    <text x="40" y="316" font-size="10" fill="#717171">&#9654; read_code</text>
    <text x="130" y="316" font-size="10" fill="#aeaeae">path="src/lib/api/client.ts"</text>
  </g>
  <g class="s9">
    <text x="56" y="334" font-size="10" fill="#555555">&#8627; 142 lines — definition found on first read</text>
  </g>

  <!-- Comparison callout -->
  <g class="s10">
    <rect x="40" y="352" width="640" height="68" rx="6" fill="#181818" stroke="#3d3d3d" stroke-width="0.5"/>

    <text x="52" y="372" font-size="10" fill="#ebebeb" class="sans">Without pgr:</text>
    <text x="160" y="372" font-size="10" fill="#717171" class="sans">3 searches + bash fallback before finding the right file</text>

    <text x="52" y="396" font-size="10" fill="#60a5fa" class="sans">With pgr:</text>
    <text x="160" y="396" font-size="10" fill="#aeaeae" class="sans">1 search &#8594; definition ranked first &#8594; immediate read</text>
  </g>

  <!-- Blinking cursor -->
  <rect x="40" y="340" width="7" height="2" fill="#60a5fa" class="cursor"/>
</svg>
