<svg width="100%" viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" style="background:#0c0c0c">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace; }
  </style>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#60a5fa"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#fb923c"/>
    </marker>
    <clipPath id="timeBarClip">
      <rect x="80" y="195" width="560" height="40" rx="6"/>
    </clipPath>
  </defs>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#ebebeb">Where Time Goes in the Agent Loop</text>

  <!-- ============ FLOW DIAGRAM ============ -->

  <!-- Node 1: Model Inference -->
  <rect x="30" y="62" width="112" height="44" rx="6" fill="#222222" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="86" y="82" text-anchor="middle" font-size="10" font-weight="600" fill="#60a5fa">Model</text>
  <text x="86" y="95" text-anchor="middle" font-size="10" font-weight="600" fill="#60a5fa">Inference</text>

  <line x1="142" y1="84" x2="158" y2="84" stroke="#3d3d3d" stroke-width="1.5"/>
  <polygon points="158,80 166,84 158,88" fill="#3d3d3d"/>

  <!-- Node 2: Choose Tool -->
  <rect x="166" y="62" width="104" height="44" rx="6" fill="#222222" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="218" y="88" text-anchor="middle" font-size="10" font-weight="600" fill="#60a5fa">Choose Tool</text>

  <line x1="270" y1="84" x2="286" y2="84" stroke="#3d3d3d" stroke-width="1.5"/>
  <polygon points="286,80 294,84 286,88" fill="#3d3d3d"/>

  <!-- Node 3: Run Tool (orange) -->
  <rect x="294" y="62" width="90" height="44" rx="6" fill="#121212" stroke="#fb923c" stroke-width="1.5"/>
  <text x="339" y="88" text-anchor="middle" font-size="10" font-weight="600" fill="#fb923c">Run Tool</text>

  <line x1="384" y1="84" x2="400" y2="84" stroke="#3d3d3d" stroke-width="1.5"/>
  <polygon points="400,80 408,84 400,88" fill="#3d3d3d"/>

  <!-- Node 4: Interpret Result -->
  <rect x="408" y="62" width="104" height="44" rx="6" fill="#222222" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="460" y="82" text-anchor="middle" font-size="10" font-weight="600" fill="#60a5fa">Interpret</text>
  <text x="460" y="95" text-anchor="middle" font-size="10" font-weight="600" fill="#60a5fa">Result</text>

  <line x1="512" y1="84" x2="528" y2="84" stroke="#3d3d3d" stroke-width="1.5"/>
  <polygon points="528,80 536,84 528,88" fill="#3d3d3d"/>

  <!-- Node 5: Choose Next Step -->
  <rect x="536" y="62" width="112" height="44" rx="6" fill="#222222" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="592" y="82" text-anchor="middle" font-size="10" font-weight="600" fill="#60a5fa">Choose Next</text>
  <text x="592" y="95" text-anchor="middle" font-size="10" font-weight="600" fill="#60a5fa">Step</text>

  <!-- Return arrow -->
  <path d="M 592,106 L 592,126 L 86,126 L 86,106" fill="none" stroke="#3d3d3d" stroke-width="1.5"/>
  <polygon points="82,106 86,98 90,106" fill="#3d3d3d"/>
  <text x="339" y="122" text-anchor="middle" font-size="9" fill="#555555">repeat</text>

  <!-- ============ TIME BREAKDOWN BAR ============ -->
  <text x="360" y="175" text-anchor="middle" font-size="14" font-weight="600" fill="#ebebeb">Wall Clock Breakdown (baseline)</text>

  <!-- Bar: blue = 80-630, orange = 630-640 (orange enlarged for visibility) -->
  <g clip-path="url(#timeBarClip)">
    <rect x="80" y="195" width="550" height="40" fill="#60a5fa"/>
    <rect x="630" y="195" width="10" height="40" fill="#fb923c"/>
  </g>

  <!-- Label inside bar -->
  <text x="355" y="219" text-anchor="middle" font-size="11" font-weight="600" fill="#121212">Model inference + planning</text>
  <text x="640" y="252" text-anchor="end" font-size="8" fill="#555555" font-style="italic">orange not to scale</text>

  <!-- ============ CALLOUT BOXES ============ -->

  <!-- Blue callout box -->
  <rect x="80" y="290" width="320" height="44" rx="6" fill="#121212" stroke="#60a5fa" stroke-width="1"/>
  <text x="240" y="308" text-anchor="middle" font-size="10" font-weight="600" fill="#60a5fa">Model inference + planning = 99.6%</text>
  <text x="240" y="323" text-anchor="middle" font-size="10" fill="#aeaeae">Better results here reduce iterations</text>

  <!-- Dashed arrow from blue box up to blue part of bar (center of blue = ~355) -->
  <line x1="240" y1="290" x2="355" y2="240" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowBlue)"/>

  <!-- Orange callout box -->
  <rect x="420" y="290" width="220" height="44" rx="6" fill="#121212" stroke="#fb923c" stroke-width="1"/>
  <text x="530" y="308" text-anchor="middle" font-size="10" font-weight="600" fill="#fb923c">Tool execution = 0.4% of wall clock</text>
  <text x="530" y="323" text-anchor="middle" font-size="10" fill="#aeaeae">Speeding this up barely moves the needle</text>

  <!-- Dashed arrow from orange box up to orange part of bar (center of orange = ~635) -->
  <line x1="530" y1="290" x2="635" y2="240" stroke="#fb923c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowOrange)"/>

  <!-- Bottom summary -->
  <text x="360" y="365" text-anchor="middle" font-size="11" fill="#717171">Removing one inference step (~2s) has the same effect as eliminating ~130 search calls</text>
</svg>
