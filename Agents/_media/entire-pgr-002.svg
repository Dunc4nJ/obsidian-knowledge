<svg width="100%" viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" style="background:#0c0c0c">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace; }
  </style>

  <!-- Title -->
  <text x="360" y="36" text-anchor="middle" font-size="17" font-weight="600" fill="#ebebeb">Agent Tool Call Breakdown</text>
  <text x="360" y="56" text-anchor="middle" font-size="11" fill="#717171">202,142 tool calls from 1,983 checkpoints</text>

  <!-- ============ DONUT CHART ============ -->
  <!-- Circumference = 2*pi*70 = 439.82 -->
  <!-- Search: 48.8% of 439.82 = 214.63 -->

  <!-- Non-search (neutral) - full circle background -->
  <circle cx="190" cy="180" r="70" fill="none" stroke="#222222" stroke-width="28"/>

  <!-- Search (blue) - 48.8% arc -->
  <circle cx="190" cy="180" r="70" fill="none" stroke="#60a5fa" stroke-width="28"
          stroke-dasharray="214.63 225.19"
          stroke-dashoffset="109.96"
          stroke-linecap="butt"/>

  <!-- Center text -->
  <text x="190" y="175" text-anchor="middle" font-size="22" font-weight="700" fill="#ebebeb" class="mono">48.8%</text>
  <text x="190" y="195" text-anchor="middle" font-size="10" fill="#aeaeae">search-related</text>

  <!-- Donut legend -->
  <rect x="320" y="145" width="12" height="12" rx="3" fill="#60a5fa"/>
  <text x="340" y="155" font-size="12" fill="#ebebeb">Search-related tool calls</text>
  <text x="340" y="171" font-size="11" fill="#717171" class="mono">98,555 calls (48.8%)</text>

  <rect x="320" y="190" width="12" height="12" rx="3" fill="#222222" stroke="#3d3d3d" stroke-width="1"/>
  <text x="340" y="200" font-size="12" fill="#ebebeb">Non-search tool calls</text>
  <text x="340" y="216" font-size="11" fill="#717171" class="mono">103,587 calls (51.2%)</text>

  <!-- ============ STACKED BAR ============ -->
  <text x="360" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#ebebeb">Search Tool Call Breakdown</text>

  <defs>
    <clipPath id="barClip">
      <rect x="60" y="310" width="600" height="36" rx="6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#barClip)">
    <!-- Read: 49.0% of 600 = 294px -->
    <rect x="60" y="310" width="294" height="36" fill="#60a5fa"/>
    <!-- Bash: 23.5% of 600 = 141px -->
    <rect x="354" y="310" width="141" height="36" fill="#a78bfa"/>
    <!-- Grep: 23.5% of 600 = 141px -->
    <rect x="495" y="310" width="141" height="36" fill="#fb923c"/>
    <!-- Other: 4.0% of 600 = 24px -->
    <rect x="636" y="310" width="24" height="36" fill="#3d3d3d"/>
  </g>

  <!-- Bar labels -->
  <text x="207" y="326" text-anchor="middle" font-size="11" font-weight="600" fill="#121212">Read / file retrieval</text>
  <text x="207" y="341" text-anchor="middle" font-size="10" fill="#121212" class="mono">49.0%</text>

  <text x="424" y="326" text-anchor="middle" font-size="10" font-weight="600" fill="#121212">Bash fallback</text>
  <text x="424" y="341" text-anchor="middle" font-size="10" fill="#121212" class="mono">23.5%</text>

  <text x="566" y="326" text-anchor="middle" font-size="10" font-weight="600" fill="#121212">Grep search</text>
  <text x="566" y="341" text-anchor="middle" font-size="10" fill="#121212" class="mono">23.5%</text>

  <!-- "Other" label below bar since segment is too small for inline text -->
  <text x="660" y="358" text-anchor="end" font-size="8" fill="#555555" class="mono">4%</text>
</svg>
