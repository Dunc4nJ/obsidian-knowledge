<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="1360" height="840" role="img">
<title>The two-player game</title>
<desc>Animated rendering of the synthesis loop. A synthesizer designs tasks, a solver runs N rollouts and returns a pass rate, a gate decides whether the tier is accepted.</desc>

<style>
/* 7s LOOP, 5 BEATS
   0.0-1.4s SYNTH FIRES
   1.4-3.5s ROLLOUTS
   3.5-4.9s RETURN
   4.9-6.3s VERDICT
   6.3-7.0s SETTLE
*/
@keyframes ga-synth-fill { 0% { fill: #0a1929; } 6%, 18% { fill: #143358; } 28%, 100% { fill: #0a1929; } }
@keyframes ga-synth-stroke { 0% { stroke: #4a9eff; stroke-width: 1.2; } 6%, 18% { stroke: #8cc4ff; stroke-width: 1.8; } 28%, 100% { stroke: #4a9eff; stroke-width: 1.2; } }
@keyframes ga-solver-fill { 0%, 20% { fill: #1c1700; } 28%, 48% { fill: #382e08; } 58%, 100% { fill: #1c1700; } }
@keyframes ga-solver-stroke { 0%, 20% { stroke: #d4b23b; stroke-width: 1.2; } 28%, 48% { stroke: #f0d670; stroke-width: 1.8; } 58%, 100% { stroke: #d4b23b; stroke-width: 1.2; } }
@keyframes ga-think { 0%, 22% { opacity: 0; } 28%, 48% { opacity: 1; } 58%, 100% { opacity: 0; } }
@keyframes ga-think-dot { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
@keyframes ga-fwd-arrow { 0%, 2% { opacity: 0.25; } 6%, 18% { opacity: 1; } 26%, 100% { opacity: 0.25; } }
@keyframes ga-fwd-label { 0% { fill: rgba(170,170,170,0.4); } 6%, 18% { fill: rgba(255,255,255,1); } 28%, 100% { fill: rgba(170,170,170,0.4); } }
@keyframes ga-fwd-packet { 0%, 2% { transform: translateX(0); opacity: 0; } 4% { opacity: 1; } 18% { transform: translateX(107px); opacity: 1; } 20%, 100% { transform: translateX(107px); opacity: 0; } }
@keyframes ga-back-arrow { 0%, 48% { opacity: 0.25; } 54%, 66% { opacity: 1; } 74%, 100% { opacity: 0.25; } }
@keyframes ga-back-label { 0%, 48% { fill: rgba(170,170,170,0.4); } 54%, 66% { fill: rgba(255,255,255,1); } 74%, 100% { fill: rgba(170,170,170,0.4); } }
@keyframes ga-back-packet { 0%, 52% { transform: translateX(0); opacity: 0; } 54% { opacity: 1; } 66% { transform: translateX(-107px); opacity: 1; } 68%, 100% { transform: translateX(-107px); opacity: 0; } }
@keyframes ga-vert { 0%, 64% { opacity: 0.35; stroke-dashoffset: 0; } 74%, 88% { opacity: 1; stroke-dashoffset: -30; } 96%, 100% { opacity: 0.35; stroke-dashoffset: -30; } }
@keyframes ga-gate-fill { 0%, 68% { fill: #0a0a0a; } 78%, 90% { fill: #142e1e; } 96%, 100% { fill: #0a0a0a; } }
@keyframes ga-gate-stroke { 0%, 68% { stroke: #ffffff; stroke-width: 1.2; } 78%, 90% { stroke: #9ee3b8; stroke-width: 1.8; } 96%, 100% { stroke: #ffffff; stroke-width: 1.2; } }
@keyframes ga-gate-text { 0%, 68% { fill: rgba(255,255,255,0.85); } 78%, 90% { fill: rgba(255,255,255,1); } 96%, 100% { fill: rgba(255,255,255,0.85); } }

.ga-synth-rect { animation: ga-synth-fill 7s cubic-bezier(0.4,0,0.2,1) infinite, ga-synth-stroke 7s cubic-bezier(0.4,0,0.2,1) infinite; }
.ga-solver-rect { animation: ga-solver-fill 7s cubic-bezier(0.4,0,0.2,1) infinite, ga-solver-stroke 7s cubic-bezier(0.4,0,0.2,1) infinite; }
.ga-think-group { animation: ga-think 7s ease-in-out infinite; }
.ga-think-1 { animation: ga-think-dot 0.9s ease-in-out infinite; }
.ga-think-2 { animation: ga-think-dot 0.9s ease-in-out infinite -0.18s; }
.ga-think-3 { animation: ga-think-dot 0.9s ease-in-out infinite -0.36s; }
.ga-fwd-arrow { animation: ga-fwd-arrow 7s cubic-bezier(0.4,0,0.2,1) infinite; }
.ga-fwd-label { animation: ga-fwd-label 7s cubic-bezier(0.4,0,0.2,1) infinite; }
.ga-fwd-packet { animation: ga-fwd-packet 7s linear infinite; }
.ga-back-arrow { animation: ga-back-arrow 7s cubic-bezier(0.4,0,0.2,1) infinite; }
.ga-back-label { animation: ga-back-label 7s cubic-bezier(0.4,0,0.2,1) infinite; }
.ga-back-packet { animation: ga-back-packet 7s linear infinite; }
.ga-vert { stroke-dasharray: 5 5; animation: ga-vert 7s cubic-bezier(0.4,0,0.2,1) infinite; }
.ga-gate-rect { animation: ga-gate-fill 7s cubic-bezier(0.4,0,0.2,1) infinite, ga-gate-stroke 7s cubic-bezier(0.4,0,0.2,1) infinite; }
.ga-gate-label { animation: ga-gate-text 7s cubic-bezier(0.4,0,0.2,1) infinite; }

text { font-family: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; }
</style>

<defs>
<marker id="arrWh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="420" fill="#000000"/>

<rect class="ga-synth-rect" x="40" y="70" width="240" height="64" rx="2" fill="#0a1929" stroke="#4a9eff" stroke-width="1.2"/>
<text x="160" y="108" text-anchor="middle" fill="#4a9eff" font-size="14" letter-spacing="0.14em">SYNTHESIZER</text>

<rect class="ga-solver-rect" x="400" y="70" width="240" height="64" rx="2" fill="#1c1700" stroke="#d4b23b" stroke-width="1.2"/>
<text x="520" y="108" text-anchor="middle" fill="#d4b23b" font-size="14" letter-spacing="0.14em">SOLVER</text>

<g class="ga-think-group">
<circle class="ga-think-1" cx="508" cy="125" r="1.6" fill="#d4b23b"/>
<circle class="ga-think-2" cx="520" cy="125" r="1.6" fill="#d4b23b"/>
<circle class="ga-think-3" cx="532" cy="125" r="1.6" fill="#d4b23b"/>
</g>

<text x="40" y="158" fill="#888888" font-size="11" letter-spacing="0.06em">DESIGN DB, TOOLS, INSTRUCTIONS.</text>
<text x="40" y="175" fill="#888888" font-size="11" letter-spacing="0.06em">WRITES SOLUTIONS AND VERIFY</text>
<text x="400" y="158" fill="#888888" font-size="11" letter-spacing="0.06em">RUNS N ROLLOUTS ON THE TASK.</text>
<text x="400" y="175" fill="#888888" font-size="11" letter-spacing="0.06em">MEASURE EMPIRICAL PASS RATE</text>

<text x="340" y="90" text-anchor="middle" class="ga-fwd-label" fill="rgba(170,170,170,0.4)" font-size="11" letter-spacing="0.12em">NEW TASK</text>
<line class="ga-fwd-arrow" x1="285" y1="97" x2="395" y2="97" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrWh)"/>
<circle class="ga-fwd-packet" cx="285" cy="97" r="3" fill="#8cc4ff"/>

<text x="340" y="130" text-anchor="middle" class="ga-back-label" fill="rgba(170,170,170,0.4)" font-size="11" letter-spacing="0.12em">PASS RATE</text>
<line class="ga-back-arrow" x1="395" y1="115" x2="285" y2="115" stroke="#ffffff" stroke-width="1.2" marker-end="url(#arrWh)"/>
<circle class="ga-back-packet" cx="395" cy="115" r="3" fill="#f0d670"/>

<line class="ga-vert" x1="160" y1="196" x2="160" y2="278" stroke="#ffffff" stroke-width="1" opacity="0.35" marker-end="url(#arrWh)"/>
<line class="ga-vert" x1="520" y1="196" x2="520" y2="278" stroke="#ffffff" stroke-width="1" opacity="0.35" marker-end="url(#arrWh)"/>

<rect class="ga-gate-rect" x="40" y="286" width="600" height="50" rx="2" fill="#0a0a0a" stroke="#ffffff" stroke-width="1.2"/>
<text x="340" y="318" text-anchor="middle" class="ga-gate-label" fill="rgba(255,255,255,0.85)" font-size="14" letter-spacing="0.14em">GATE AGAINST TARGET SOLVE BAND</text>

<text x="340" y="370" text-anchor="middle" fill="#888888" font-size="11" letter-spacing="0.1em">IN BAND → ACCEPT TIER / OUTSIDE → ADJUST AND RETRY</text>

</svg>
